<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Minicharts: desk, sheets of paper, serif names, one red pen. One look by choice. */
:root{--desk:#e3dac8;--paper:#fbf6ec;--ink:#2f261e;--soft:#6f6150;--red:#b23a38;--shade:#cdbfa8;
  --serif:"Young Serif",Georgia,serif;--hand:Gaegu,"DM Sans",sans-serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
#top h1{font:400 clamp(36px,10.5vw,68px)/1 var(--serif);letter-spacing:-.01em;margin:0}
#top h2{font:400 clamp(19px,2.2vw,25px)/1.2 var(--serif);margin:8px 0 0}
#top p{font:400 19px/1.3 var(--hand);font-size-adjust:.5;color:var(--red);margin:10px 0 0}
section{display:flex;flex-direction:column;gap:14px}
.parthead{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.parthead h2{font:400 clamp(22px,2.6vw,30px)/1.15 var(--serif);margin:0;text-wrap:balance}
.parthead p{font:400 17px/1.25 var(--hand);font-size-adjust:.5;color:var(--red);margin:0;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1040px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--ink);border-radius:3px;display:flex;flex-direction:column;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 520px}
.cap2{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--ink)}
.cap2 h3{font:400 20px/1.15 var(--serif);margin:0}
.cap2 p{font:400 15.5px/1.2 var(--hand);font-size-adjust:.5;color:var(--soft);margin:0;min-width:0}
.cap2:has(.kind){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline}.cap2:has(.kind) p{grid-column:1/-1;grid-row:2}.cap2:has(.kind) h3{grid-row:1}
.kind{justify-self:end;grid-row:1;font:400 14px/1 var(--hand);font-size-adjust:.5;color:var(--red);border:1px solid currentColor;border-radius:20px;padding:4px 9px 3px;white-space:nowrap}
.card svg{display:block;width:100%;height:auto;aspect-ratio:520/420}
.card[data-m=plain] svg[data-m=art],.card[data-m=art] svg[data-m=plain]{display:none}
.foot{display:flex;flex-direction:column;flex:1;border-top:1px dashed var(--shade)}.foot .note{border-top:0}.foot .mode{align-self:flex-end;margin:0 12px 11px}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:20px;overflow:hidden;flex:none;font:400 13.5px/1 var(--hand);font-size-adjust:.5}
.mode button{font:inherit;color:var(--ink);background:none;border:0;padding:6px 10px 5px;cursor:pointer}.mode button+button{border-left:1px solid var(--ink)}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
body:has(.mode.all){padding-bottom:80px}.mode.all{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);background:var(--paper);box-shadow:0 2px 0 var(--ink),0 6px 18px rgba(40,30,20,.18);font-size:16px}.mode.all button{padding:9px 18px 8px}
.note{font:400 16.5px/1.25 var(--hand);font-size-adjust:.5;color:var(--red);margin:0;padding:9px 13px 11px;box-sizing:border-box;height:calc(5em + 20px);overflow:hidden;flex:none;border-top:1px dashed var(--shade)}
footer{font-size:13.5px;line-height:1.55;color:var(--soft);border-top:1px solid var(--shade);padding-top:12px;max-width:62ch}
footer a{color:inherit}
text{user-select:none}
text.it,text.cap{font-family:var(--hand);font-size-adjust:.43}
text.it{letter-spacing:.3px}text.cap{letter-spacing:1px}
text.ser{font-family:var(--serif)}
.p{cursor:pointer;outline:none;transition:opacity .18s,transform .22s cubic-bezier(.3,.8,.3,1)}
.live .p:not(.on){opacity:.36}
.p.on{transform:translate(var(--dx,0),var(--dy,0))}
.p:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bead{pointer-events:none}
.halo{pointer-events:none;animation:in .25s ease both}
@keyframes in{from{opacity:0}}
.mv{transform-box:fill-box;transform-origin:50% 50%}
.steam{animation:steam 3.2s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}
.buzz{animation:buzz 1.6s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0)}25%{transform:translate(1.6px,-1.8px)}50%{transform:translate(-1px,1.4px)}75%{transform:translate(1.8px,1px)}}
.fall{animation:fall 1.5s linear infinite}
@keyframes fall{from{transform:translateY(-7px);opacity:0}25%{opacity:1}75%{opacity:1}to{transform:translateY(9px);opacity:0}}
.flick{animation:flick 1.9s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.07,.92)}}
.sway{animation:sway 4.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.drift{animation:drift 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
.turn{animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.off .mv{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.mv{animation:none}.p,.halo{transition:none;animation:none}}
#defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:480px){.note{height:calc(6.25em + 20px)}}
.grid:has(> .card:only-child){grid-template-columns:minmax(0,1fr);max-width:860px}
.grid:has(> .card:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.grid:has(> .card:nth-child(2):last-child){grid-template-columns:minmax(0,1fr)}}
</style>

card({id:'pie',sec:'named',name:'Pie chart',of:'one Sunday, 24 hours',note:'Each slice is that many hours of a Sunday. Touch one to lift it out.',draw(){
  const D = [['sleep',9,'nine hours, no alarm'],['reading',4,'four hours on the sofa'],['nothing',4,'four hours of nothing at all'],['cooking',3,'three hours, mostly stirring'],['a walk',2,'two hours round the park'],['lunch',2,'two hours, with seconds']];
  OX = 262; OY = 196; const R = 112, H = 22, tot = 24, GAP = 3.2, rad = d => d*Math.PI/180; let a = -112;
  const pie = D.map(([n,h,t]) => { const b = a+h/tot*360, m = (a+b)/2; const it = {n,h,t,a0:a,a1:b,m,ox:GAP*Math.cos(rad(m)),oy:GAP*Math.sin(rad(m))}; a = b; return it; });
  const ring = (r,z,n = 64) => Array.from({length:n},(_,i) => P(r*Math.cos(i/n*2*Math.PI),r*Math.sin(i/n*2*Math.PI),z));
  /* a cream plate with a well, and its soft shadow */
  const pr = R+30; out.push(`<path d="${pathOf(ring(pr,-6))}Z" fill="#92949d" opacity=".16" transform="translate(-7 9)"/>`);
  wash(ring(pr,-9),'#cec9c1',{dx:0,dy:0}); wash(ring(pr,-5),'#f2efe7',{dx:0,dy:0}); lid(ring(pr,-5),1.15); rim(ring(pr-17,-5),.7,'#bcb5a8'); rim(ring(pr-4,-5),.5,'#dfdad0');

      rule([[A(u,R*.25,7),A(u,R*.7,9)],[A(u,R*.45,12),A(u,R*.9,11)]],JUICE,1.4,.7); rim(q(0,H),.6,mixC(FILL,TONE,.5)); }

      rule(fr.filter((_,i) => i%1 === 0).map(u => [A(u,R,2),A(u,R,H-2)]),mixC(WALL,TONE,.3),.55,.55); line(lo,{w:1,over:0}); }
    /* the top: baked crimped edge, paler middle, two steam vents, a little gloss */

    for (let d = Math.ceil(s.a0/7)*7+3.5; d < s.a1-1; d += 7) rule([[A(d,R*.82,H),A(d,R*.99,H)]],mixC(BAKED,TONE,.45),.75,.8);
    const vm = (s.a0+s.a1)/2, sp = Math.min(9,(s.a1-s.a0)*.18);

      out.push(`<path d="M${n1(p0[0])} ${n1(p0[1])}Q${n1(mx[0]+nx)} ${n1(mx[1]+ny)} ${n1(p1[0])} ${n1(p1[1])}Q${n1(mx[0]-nx)} ${n1(mx[1]-ny)} ${n1(p0[0])} ${n1(p0[1])}Z" fill="${FILL}" stroke="${mixC(CRUST,TONE,.5)}" stroke-width=".6"/>`); }

/* r4: small drawing helpers for the cards in this file only */
const r4 = (() => {
  const I = '#5e5f6b';
  const sol = (pts,col,op = 1) => out.push(`<path d="${pathOf(pts)}Z" fill="${col}"${op < 1 ? ` opacity="${op}"` : ''}/>`);
  const el = (cx,cy,rx,ry = rx,n = 28) => Array.from({length:n},(_,i) => { const t = i/n*2*Math.PI; return [cx+rx*Math.cos(t),cy+ry*Math.sin(t)]; });
  const arc = (cx,cy,rx,ry,a0,a1,n = 16) => Array.from({length:n+1},(_,i) => { const t = (a0+(a1-a0)*i/n)*Math.PI/180; return [cx+rx*Math.cos(t),cy+ry*Math.sin(t)]; });
  const pt = (pts,col,w = 1,ic = I) => { sol(pts,col); rim(pts,w,ic); };
  const ln = (pts,col = I,w = 1,op = 1,dash) => out.push(`<path d="${pathOf(pts)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${op < 1 ? ` opacity="${op}"` : ''}${dash ? ` stroke-dasharray="${dash}"` : ''}/>`);
  const bx = (x,y,w,h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  const rot = (deg,cx,cy,fn) => { out.push(`<g transform="rotate(${n1(deg)} ${n1(cx)} ${n1(cy)})">`); fn(); out.push('</g>'); };
  let F = 'r4f';
  const defs = (k,extra = '') => { F = 'r4f-'+k; out.push(`<defs><filter id="${F}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>${extra}</defs>`); };
  /* a soft shadow: the shape again, dark, blurred and pushed down-right */
  const shade = (pts,dx = 3,dy = 4,op = .18) => out.push(`<path d="${pathOf(pts)}Z" fill="${I}" opacity="${op}" transform="translate(${dx} ${dy})" filter="url(#${F})"/>`);
  /* wood grain: long gentle waves, one path */
  const grain = (x0,y0,x1,y1,gap,col,op = .5,w = .6) => { let d = ''; for (let y = y0+gap/2; y < y1; y += gap){ const ph = rnd()*6, a = .6+rnd()*1.4; let s = ''; for (let x = x0; x <= x1; x += 10) s += (s ? 'L' : 'M')+n1(x)+' '+n1(y+a*Math.sin(x*.016+ph)+.5*Math.sin(x*.06+ph*2)); d += s; } out.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`); };
  /* specks: many tiny round dots in one path */
  const specks = (x0,y0,x1,y1,n,col,w = 1.4,op = .5) => { let d = ''; for (let i = 0; i < n; i++) d += `M${n1(x0+rnd()*(x1-x0))} ${n1(y0+rnd()*(y1-y0))}h.01`; out.push(`<path d="${d}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`); };
  /* the same outline moved inwards by d */
  const inset = (pts,d) => { const n = pts.length, area = q => Math.abs(q.reduce((s,p,i) => { const r = q[(i+1)%n]; return s+p[0]*r[1]-r[0]*p[1]; },0)), off = k => pts.map((p,i) => { const a = pts[(i-1+n)%n], b = pts[(i+1)%n], tx = b[0]-a[0], ty = b[1]-a[1], l = Math.hypot(tx,ty)||1; return [p[0]-ty/l*d*k,p[1]+tx/l*d*k]; }); const A = off(1), B = off(-1); return area(A) < area(B) ? A : B; };
  return {I,sol,el,arc,pt,ln,bx,rot,defs,shade,grain,specks,inset};
})();

/* HOW MUCH. Every chart here is a small scene: real objects carry the numbers, to scale. Helpers are this file's own (r5). */

const r5pt = (pts,col,w = 1,ic = r5I) => { flat(pts,col); rim(pts,w,ic); };
const r5ln = (pts,col,w = 1,op = 1) => out.push(`<path d="${pathOf(pts)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${op < 1 ? ` opacity="${op}"` : ''}/>`);

/* a sandwich loaf, side on, sitting on b */
const r5loaf = (x,b,c = '#cfac73') => { const body = spline([[x-11,b],[x+11,b],[x+11.6,b-5],[x+9,b-9.6],[x,b-10.8],[x-9,b-9.6],[x-11.6,b-5]],true,2), dome = spline([[x-11.4,b-5.2],[x-9,b-9.6],[x,b-10.8],[x+9,b-9.6],[x+11.4,b-5.2],[x+5,b-6.8],[x-5,b-6.8]],true,2);

CARDS.forEach(c => c.sec = "chart");

/* draws every card once, then moves nothing but CSS: ink is never redrawn on hover */
const hash = s => { let h = 7; for (const c of s) h = Math.imul(h,31)+c.charCodeAt(0)|0; return h; };
const grid = {}; const $ = id => document.getElementById(id);
/* the themes page puts each named chart in a row with its two other subjects: the thing itself, a swapped object, a plain chart */
const MODE = document.querySelector('.page').dataset.mode, KIND = {itself:'the thing itself',swapped:'swapped object',plain:'plain chart'};
const sheet = (c,draw) => { begin(hash(c.id)); LOOSE = .22; OX = 260; OY = 210; draw.call(c); flush(); LOOSE = 0; return out.join(''); };
const NAMES = {plain:'plain',art:'drawn in'};
/* the Minicharts page shows only drawn-in charts: a card whose own mode is plain takes its drawn-in version, and no card gets a switch */
const SOLO = MODE === 'site'; if (SOLO) KIND.plain = 'everyday numbers';
const paint = (c,kind) => {
  /* the drawn-in versions read their numbers from the plain drawing through this.draw, so the card itself stays as it is */
  const swap = SOLO && kind === 'plain' && ALT[c.id]; if (swap) kind = 'drawn'; const note = swap ? swap.note : c.note;
  const el = document.createElement('article'); el.className = 'card'; el.id = c.id; const h = kind ? (c.theme || LIT[c.id] || c.name) : c.name;
  /* a themes card can hold both modes: plain (a simple chart with a drawing beside it) and art (the chart drawn as the thing) */
  const own = kind === 'plain' ? 'plain' : 'art', alt = !SOLO && kind && ALT[c.id], other = own === 'plain' ? 'art' : 'plain', svgOf = (m,body) => `<svg data-m="${m}" viewBox="0 0 ${SHW} ${SHH}" role="img" aria-label="${h}: ${esc(c.of)}">${body}</svg>`;
  el.dataset['n'+own] = note; if (alt) el.dataset['n'+other] = alt.note;
  el.innerHTML = `<header class="cap2"><h3>${h}</h3><p>${c.of}</p>${kind ? `<span class="kind">${KIND[kind === 'drawn' ? 'plain' : kind]}</span>` : ''}</header>${svgOf(own,sheet(c,swap ? swap.draw : c.draw))}${alt ? svgOf(other,sheet(c,alt.draw)) : ''}<div class="foot"><p class="note" aria-live="polite">${note}</p>${alt ? `<div class="mode" role="group" aria-label="mode"><button data-m="plain">plain</button><button data-m="art">drawn in</button></div>` : ''}</div>`;
  el.dataset.own = own; el.dataset.m = own; el.dataset.note = note; return el; };
/* switch one card, or every card, between plain and drawn-in */
const setMode = (el,m) => { if (!el.querySelector(`svg[data-m="${m}"]`)) m = el.dataset.own; el.dataset.m = m; el.dataset.note = el.dataset['n'+m] || el.dataset.note; el.querySelector('.note').textContent = el.dataset.note; el.querySelectorAll('.mode button').forEach(b => b.setAttribute('aria-pressed',b.dataset.m === m)); };
if (MODE === 'themes' || MODE === 'site'){
  /* the site page shows the named charts as these rows, and every other chart once, below */
  const host = $('rows'); let n = 0;
  const DROP = ['raincloud']; /* rows taken off the themes page; their cards stay in the files */
  for (const c of CARDS.filter(c => c.sec === 'named' && !DROP.includes(c.id))){ const more = CARDS.filter(t => t.sec === 't:'+c.id); if (!more.length) continue;
    const s = document.createElement('section'); s.innerHTML = `<div class="parthead"><h2>${c.name}</h2><p>${[LIT[c.id] || c.name,...more.map(t => t.theme)].join(', ').toLowerCase()}</p></div><div class="grid"></div>`; host.append(s);
    const g = s.querySelector('.grid'), it = paint(c,'itself'); if (MODE === 'site') it.id = 'w-'+c.id; g.append(it); for (const t of more){ g.append(paint(t,t.kind)); n++; }

  if (MODE === 'site'){ const types = CARDS.filter(c => !c.sec.includes(':')); const all = document.querySelector('section[data-s="all"] .grid'); for (const c of [...types].sort((a,b) => a.name.localeCompare(b.name))) all.append(paint(c)); const nr = $('nrows'); if (nr) nr.textContent = host.children.length; n = types.length; document.querySelectorAll('.n54').forEach(e => e.textContent = n); }
  ($('total') || {}).textContent = n;

  document.addEventListener('click',e => { const b = e.target.closest?.('.mode button'); if (!b) return; if (b.closest('.all')) all(b.dataset.m); else { setMode(b.closest('.card'),b.dataset.m); bar.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed',[...document.querySelectorAll('.card')].every(el => el.dataset.m === x.dataset.m))); } });

/* side illustrations on plain charts sit at a set size: each is scaled about the middle of its base */
const DECO = ['Two terraced houses','The returns shelf','Somebody in class B','A flat white and a croissant','The trainers that','The bike in the window','The radiator is','Everything you carried','The shop phone','The school bus:','The one letter','A plane tree','An umbrella and wellies','A punnet of','The upright at home','Dinner on the table','Two boxes at the door','New in this week','Somewhere on this street','Our basil','A sunny day','The 42, pulling','The jar on the kitchen','The class fruit bowl','Lights out at eight'], DECO_K = .72;

  const b = g.getBBox(), cx = b.x+b.width/2, cy = b.y+b.height, w = document.createElementNS('http://www.w3.org/2000/svg','g');

/* a red pen ring, drawn the first time a part is touched */
const ringOf = g => { if (g.dataset.ringed) return; g.dataset.ringed = 1; const b = g.getBBox(), cx = b.x+b.width/2, cy = b.y+b.height/2, rx = b.width/2+9, ry = b.height/2+8; seedWith(hash(g.dataset.n)); out = []; LOOSE = .35; const a0 = rnd()*6; line(Array.from({length:40},(_,i) => { const t = a0+i/36*2*Math.PI; return [cx+rx*Math.cos(t),cy+ry*Math.sin(t)]; }),{w:1.5,col:RED,over:0}); LOOSE = 0; const h = document.createElementNS('http://www.w3.org/2000/svg','g'); h.setAttribute('class','halo'); h.innerHTML = out.join(''); g.append(h); };
const wake = (p,c) => { c.classList.add('live'); c.querySelectorAll('.p.on').forEach(e => e.classList.remove('on')); p.classList.add('on'); if (p.classList.contains('rg')) ringOf(p); c.querySelector('.note').textContent = p.dataset.n; };
const rest = c => { c.classList.remove('live'); c.querySelectorAll('.p.on').forEach(e => e.classList.remove('on')); c.querySelector('.note').textContent = c.dataset.note; };
/* a part that lifts can slide out from under the pointer, so hold it until the lift has finished. A finger leaving the glass is not leaving the card: a tap stays on until the next tap. */
let held = 0, liveCard = null;
const aim = e => { if (e.timeStamp < held) return; const p = e.target.closest?.('.p'), c = e.target.closest?.('.card'); if (liveCard && liveCard !== c){ rest(liveCard); liveCard = null; } if (p && c){ if (!p.classList.contains('on')){ wake(p,c); liveCard = c; if (p.style.getPropertyValue('--dy')) held = e.timeStamp+260; } } else if (c && e.pointerType === 'mouse'){ rest(c); liveCard = null; } };
document.addEventListener('pointerover',aim);
document.addEventListener('pointermove',aim);
document.addEventListener('pointerdown',aim);
document.addEventListener('pointerout',e => { if (e.pointerType === 'touch') return; const c = e.target.closest?.('.card'); if (c && !c.contains(e.relatedTarget)){ rest(c); liveCard = null; held = 0; } });
document.addEventListener('focusin',e => { const p = e.target.closest?.('.p'), c = e.target.closest?.('.card'); if (p && c) wake(p,c); });
document.addEventListener('focusout',e => { const c = e.target.closest?.('.card'); if (c && !c.contains(e.relatedTarget)) rest(c); });
document.addEventListener('keydown',e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('.p')) e.preventDefault(); });
/* only what is on screen keeps moving */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const svgs = [...document.querySelectorAll('.card svg')];
if (still) svgs.forEach(s => s.pauseAnimations());
else { const io = new IntersectionObserver(es => es.forEach(e => { e.target.classList.toggle('off',!e.isIntersecting); e.isIntersecting ? e.target.unpauseAnimations() : e.target.pauseAnimations(); })); svgs.forEach(s => { s.pauseAnimations(); s.classList.add('off'); io.observe(s); }); }
